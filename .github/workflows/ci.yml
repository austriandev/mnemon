name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: mnemon
          POSTGRES_PASSWORD: mnemon
          POSTGRES_DB: mnemon
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U mnemon -d mnemon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MNEMON_DATABASE_URL: postgres://mnemon:mnemon@localhost:54320/mnemon
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm web:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
